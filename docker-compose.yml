services:
  # ─── Flask Backend API (Supabase PostgreSQL + Razorpay) ───────────────────
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: arena-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - ./server/.env
    environment:
      - PORT=5001
      - PYTHONUNBUFFERED=1
    volumes:
      # Persistent storage for uploaded tournament/reward images
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - arena-network

  # ─── React Vite Frontend (Nginx Alpine SPA Server + API Reverse Proxy) ─────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
        - VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY}
        - VITE_RAZORPAY_KEY_ID=${VITE_RAZORPAY_KEY_ID}
        - VITE_BACKEND_URL=${VITE_BACKEND_URL}
        - VITE_YOUTUBE_API_KEY=${VITE_YOUTUBE_API_KEY}
        - VITE_YOUTUBE_CHANNEL_ID=${VITE_YOUTUBE_CHANNEL_ID}
    container_name: arena-frontend
    restart: unless-stopped
    ports:
      # Access web app at http://localhost:3000 (or change to "80:80" for default HTTP port)
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - arena-network

volumes:
  backend_uploads:
    driver: local

networks:
  arena-network:
    driver: bridge
